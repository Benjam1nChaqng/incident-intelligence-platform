services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - incident_intel_postgres_data:/var/lib/postgresql/data

  migrate:
    build: .
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment: &storage-environment
      INCIDENT_INTEL_STORAGE_BACKEND: postgres
      INCIDENT_INTEL_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true

  api:
    build: .
    environment:
      <<: *storage-environment
      INCIDENT_INTEL_TOKEN_SECRET: ${INCIDENT_INTEL_TOKEN_SECRET:?set INCIDENT_INTEL_TOKEN_SECRET}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: .
    command: ["python", "-m", "incident_intel.worker"]
    environment:
      <<: *storage-environment
      INCIDENT_INTEL_WORKER_ID: synthetic-compose-worker-1
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  incident_intel_postgres_data:
