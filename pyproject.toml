[project]
name = "incident-intelligence-platform"
version = "0.1.0"
description = "Synthetic support incident ingestion and investigation API for Benji Chang's technical portfolio."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Benjamin Chang" }
]
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115",
    "pydantic>=2.8",
    "psycopg[binary]>=3.2,<4",
    "SQLAlchemy>=2.0,<3",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incident_intel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]
