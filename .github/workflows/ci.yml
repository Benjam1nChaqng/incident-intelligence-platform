name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: migrations, pytest, and ruff
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: incident_intel
          POSTGRES_USER: incident_intel
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incident_intel -d incident_intel"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      INCIDENT_INTEL_STORAGE_BACKEND: postgres
      INCIDENT_INTEL_DATABASE_URL: postgresql+psycopg://incident_intel:ci-only-password@localhost:5432/incident_intel
      INCIDENT_INTEL_TEST_DATABASE_URL: postgresql+psycopg://incident_intel:ci-only-password@localhost:5432/incident_intel
      INCIDENT_INTEL_TOKEN_SECRET: ci-placeholder-not-a-production-secret-123456789

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Run tests
        run: python -m pytest

      - name: Run lint
        run: python -m ruff check .

      - name: Build runtime image
        run: docker build -t incident-intelligence-platform:test .

      - name: Rehearse standard Compose startup and deterministic demo
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = "iip-ci-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $env:POSTGRES_DB = 'incident_intel_compose'
          $env:POSTGRES_USER = 'incident_intel_compose'
          $env:POSTGRES_PASSWORD = [Convert]::ToHexString(
            [Security.Cryptography.RandomNumberGenerator]::GetBytes(32))
          $env:POSTGRES_PORT = '54329'
          $env:API_PORT = '58001'
          $env:INCIDENT_INTEL_TOKEN_SECRET = [Convert]::ToHexString(
            [Security.Cryptography.RandomNumberGenerator]::GetBytes(48))
          Write-Output "::add-mask::$env:POSTGRES_PASSWORD"
          Write-Output "::add-mask::$env:INCIDENT_INTEL_TOKEN_SECRET"
          $env:INCIDENT_INTEL_DATABASE_URL =
            "postgresql+psycopg://$($env:POSTGRES_USER):$($env:POSTGRES_PASSWORD)@127.0.0.1:54329/$($env:POSTGRES_DB)"
          Remove-Item Env:INCIDENT_INTEL_TEST_DATABASE_URL -ErrorAction SilentlyContinue
          $existing = @(docker compose -p $project --env-file .env.example ps --all --quiet)
          if ($LASTEXITCODE -ne 0 -or $existing.Count -gt 0) {
            throw 'Compose rehearsal requires a fresh isolated CI project.'
          }
          try {
            docker compose -p $project --env-file .env.example up --build --detach
            if ($LASTEXITCODE -ne 0) { throw 'Standard Compose startup failed.' }
            $deadline = [DateTimeOffset]::UtcNow.AddSeconds(60)
            $ready = $false
            do {
              try {
                $response = Invoke-RestMethod 'http://127.0.0.1:58001/readyz' -TimeoutSec 2
                $ready = $response.status -eq 'ready'
              } catch { $ready = $false }
              if (-not $ready) { Start-Sleep -Seconds 1 }
            } while (-not $ready -and [DateTimeOffset]::UtcNow -lt $deadline)
            if (-not $ready) { throw 'Compose API never became ready.' }
            ./scripts/demo.ps1 -BaseUrl 'http://127.0.0.1:58001'
          } finally {
            docker compose -p $project --env-file .env.example down --volumes --remove-orphans
            if ($LASTEXITCODE -ne 0) { throw 'Disposable CI Compose cleanup failed.' }
          }
